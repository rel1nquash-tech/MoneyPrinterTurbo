name: Script Studio tests

on:
  push:
    branches:
      - feature/trend-generator
    paths:
      - "app/script_studio/**"
      - "app/video_use/**"
      - "test/script_studio/**"
      - "test/video_use/**"
      - "webui/pages/✍️ AI Script Studio.py"
      - "webui/Main.py"
      - ".github/workflows/script-studio-tests.yml"
  pull_request:
    paths:
      - "app/script_studio/**"
      - "test/script_studio/**"
      - "webui/pages/✍️ AI Script Studio.py"
      - ".github/workflows/script-studio-tests.yml"
  workflow_dispatch:

jobs:
  unit-tests:
    name: Script Studio unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install targeted test dependencies
        run: python -m pip install pytest openai loguru requests toml
      - name: Run Script Studio tests
        run: python -m pytest test/script_studio test/video_use -q
