name: Script Studio tests

on:
  push:
    branches:
      - feature/trend-generator
    paths:
      - "app/services/voice.py"
      - "app/services/material.py"
      - "config.example.toml"
      - "pyproject.toml"
      - "requirements.txt"
      - "uv.lock"
      - "scripts/validate_multi_format.py"
      - "app/script_studio/**"
      - "app/video_pipeline/**"
      - "app/video_use/**"
      - "test/script_studio/**"
      - "test/video_pipeline/**"
      - "test/video_use/**"
      - "webui/pages/🎬 Multi-format Video.py"
      - "webui/pages/✍️ AI Script Studio.py"
      - "webui/Main.py"
      - ".github/workflows/script-studio-tests.yml"
  pull_request:
    paths:
      - "app/video_use/**"
      - "webui/Main.py"
      - "app/services/voice.py"
      - "app/services/material.py"
      - "config.example.toml"
      - "pyproject.toml"
      - "requirements.txt"
      - "uv.lock"
      - "scripts/validate_multi_format.py"
      - "app/script_studio/**"
      - "app/video_pipeline/**"
      - "test/script_studio/**"
      - "test/video_pipeline/**"
      - "test/video_use/**"
      - "webui/pages/🎬 Multi-format Video.py"
      - "webui/pages/✍️ AI Script Studio.py"
      - ".github/workflows/script-studio-tests.yml"
  workflow_dispatch:

jobs:
  unit-tests:
    name: Script Studio unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install targeted test dependencies
        run: python -m pip install pytest openai loguru requests toml
      - name: Compile main WebUI entry point
        run: python -m py_compile webui/Main.py "webui/pages/🎬 Multi-format Video.py" scripts/validate_multi_format.py
      - name: Run Script Studio and video pipeline tests
        run: python -m pytest test/script_studio test/video_pipeline test/video_use -q
